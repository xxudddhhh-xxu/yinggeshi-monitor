# 免费部署到 GitHub Pages:推送到 main 分支自动构建发布
# 访问地址:https://<用户名>.github.io/<仓库名>/
# 注意:如果仓库本身就是 <用户名>.github.io,把下面 VITE_BASE 改成 /
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # 资源按仓库名子路径打包(GitHub Pages 项目站点)
          VITE_BASE: /${{ github.event.repository.name }}/

      # SPA 使用 history 路由,GitHub Pages 没有 fallback,
      # 用官方 404.html 技巧让深链(如 /device/list)也能回到应用
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
